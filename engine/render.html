</head><body>
<canvas id="out"></canvas>
<script>
/* =====================================================================
   Bağımlılıksız 3D video motoru (WebGL2) + motion graphics katmanı.
   Python (pipeline/render.py) window.__DATA'yı enjekte eder ve her kare
   için window.renderFrame(i) çağırır.
   ===================================================================== */
(async () => {
const D = window.__DATA;
const W = D.width, H = D.height, FPS = D.fps;
const S3D = D.scale3d || 0.75;
const GW = Math.round(W * S3D), GH = Math.round(H * S3D);
const PORTRAIT = H > W;

const out = document.getElementById('out'); out.width = W; out.height = H;
const ctx = out.getContext('2d');
const glc = document.createElement('canvas'); glc.width = GW; glc.height = GH;
const gl = glc.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true});
if (!gl) throw new Error('WebGL2 yok');
gl.getExtension('EXT_color_buffer_float');

/* ---------------- yardımcılar ---------------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const clamp01=x=>Math.max(0,Math.min(1,x));
const easeOut=x=>1-Math.pow(1-clamp01(x),3);
const easeInOut=x=>{x=clamp01(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOutBack=x=>{x=clamp01(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const hex=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)};
const lin=c=>c.map(v=>Math.pow(v,2.2));          // sRGB -> lineer
const C=h=>lin(hex(h));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const M = {
  persp(fovy,a,n,f){const t=1/Math.tan(fovy/2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0])},
  lookAt(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);
    return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])},
  mul(a,b){const r=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];r[i*4+j]=s}return r},
  inv(m){const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;d=1/d;
    return new Float32Array([(a11*b11-a12*b10+a13*b09)*d,(a02*b10-a01*b11-a03*b09)*d,(a31*b05-a32*b04+a33*b03)*d,(a22*b04-a21*b05-a23*b03)*d,(a12*b08-a10*b11-a13*b07)*d,(a00*b11-a02*b08+a03*b07)*d,(a32*b02-a30*b05-a33*b01)*d,(a20*b05-a22*b02+a23*b01)*d,(a10*b10-a11*b08+a13*b06)*d,(a01*b08-a00*b10-a03*b06)*d,(a30*b04-a31*b02+a33*b00)*d,(a21*b02-a20*b04-a23*b00)*d,(a11*b07-a10*b09-a12*b06)*d,(a00*b09-a01*b07+a02*b06)*d,(a31*b01-a30*b03-a32*b00)*d,(a20*b03-a21*b01+a22*b00)*d])}
};

/* ---------------- geometri ---------------- */
// Malzeme kodları: 0 standart, 1 pencereli bina, 2 su, 3 ışık yayan
class Geo {
  constructor(){this.v=[]}
  vtx(p,n,c,m){this.v.push(p[0],p[1],p[2],n[0],n[1],n[2],c[0],c[1],c[2],m)}
  tri(a,b,c,col,m){const n=norm(cross(sub(b,a),sub(c,a)));this.vtx(a,n,col,m);this.vtx(b,n,col,m);this.vtx(c,n,col,m)}
  quad(a,b,c,d,col,m){this.tri(a,b,c,col,m);this.tri(a,c,d,col,m)}
  box(cx,cy,cz,sx,sy,sz,col,m=0){const x0=cx-sx/2,x1=cx+sx/2,y0=cy,y1=cy+sy,z0=cz-sz/2,z1=cz+sz/2;
    this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],col,m);
    this.quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],col,m);
    this.quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],col,m);
    this.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],col,m);
    this.quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],col,m===1?0:m)}
  cyl(cx,cy,cz,r0,r1,h,seg,col,m=0,cap=true){const sl=(r0-r1)/h;
    for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
      const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
      const n0=norm([c0,sl,s0]),n1=norm([c1,sl,s1]);
      const p00=[cx+r0*c0,cy,cz+r0*s0],p01=[cx+r0*c1,cy,cz+r0*s1],p10=[cx+r1*c0,cy+h,cz+r1*s0],p11=[cx+r1*c1,cy+h,cz+r1*s1];
      this.vtx(p00,n0,col,m);this.vtx(p01,n1,col,m);this.vtx(p11,n1,col,m);
      this.vtx(p00,n0,col,m);this.vtx(p11,n1,col,m);this.vtx(p10,n0,col,m);
      if(cap&&r1>0){const t=[cx,cy+h,cz];this.vtx(t,[0,1,0],col,m);this.vtx(p10,[0,1,0],col,m);this.vtx(p11,[0,1,0],col,m)}}}
  dome(cx,cy,cz,r,sy,seg,rings,col,m=0){
    for(let j=0;j<rings;j++){const t0=j/rings*Math.PI/2,t1=(j+1)/rings*Math.PI/2;
      for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
        const P=(t,a)=>[cx+r*Math.cos(t)*Math.cos(a),cy+r*sy*Math.sin(t),cz+r*Math.cos(t)*Math.sin(a)];
        const N=(t,a)=>norm([Math.cos(t)*Math.cos(a),Math.sin(t)/sy,Math.cos(t)*Math.sin(a)]);
        const q=[[t0,a0],[t0,a1],[t1,a1],[t1,a0]];
        [0,1,2,0,2,3].forEach(k=>this.vtx(P(...q[k]),N(...q[k]),col,m))}}}
  sphere(cx,cy,cz,r,seg,rings,col,m=0){
    for(let j=0;j<rings;j++){const t0=-Math.PI/2+j/rings*Math.PI,t1=-Math.PI/2+(j+1)/rings*Math.PI;
      for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
        const N=(t,a)=>[Math.cos(t)*Math.cos(a),Math.sin(t),Math.cos(t)*Math.sin(a)];const P=(t,a)=>add([cx,cy,cz],scl(N(t,a),r));
        const q=[[t0,a0],[t0,a1],[t1,a1],[t1,a0]];[0,1,2,0,2,3].forEach(k=>this.vtx(P(...q[k]),N(...q[k]),col,m))}}}
  plane(y,size,col,m){const s=size;this.quad([-s,y,s],[s,y,s],[s,y,-s],[-s,y,-s],col,m)}
}

/* ---------------- shaderlar ---------------- */
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));return s}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);u[inf.name.replace('[0]','')]=gl.getUniformLocation(p,inf.name)}return{p,u}}

const COMMON = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
uniform vec3 uSunDir,uSunCol,uZenith,uHorizon,uGround,uFogCol;
uniform float uSunSize,uStars,uFog;
vec3 skyAt(vec3 d){
  float y=d.y;
  vec3 c=mix(uHorizon,uZenith,pow(clamp(y,0.,1.),.45));
  if(y<0.) c=mix(uHorizon,uGround,clamp(-y*4.,0.,1.));
  float sd=max(dot(d,normalize(uSunDir)),0.);
  c+=uSunCol*(pow(sd,12.)*.35+pow(sd,90.)*.6);
  c+=uSunCol*smoothstep(cos(uSunSize),cos(uSunSize*.8),sd)*6.;
  return c;
}
`;

const meshP = prog(`#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;layout(location=2) in vec3 aC;layout(location=3) in float aM;
uniform mat4 uVP;out vec3 vP;out vec3 vN;out vec3 vC;flat out float vM;
void main(){vP=aP;vN=aN;vC=aC;vM=aM;gl_Position=uVP*vec4(aP,1.);}`,
`#version 300 es
precision highp float;
in vec3 vP;in vec3 vN;in vec3 vC;flat in float vM;
uniform vec3 uCam,uSkyAmb,uGndAmb,uRimCol,uWinCol,uWaterCol;
uniform float uTime,uWinDensity,uWave;
uniform vec3 uLP[8];uniform vec3 uLC[8];uniform int uNL;
out vec4 o;
${COMMON}
void main(){
  vec3 N=normalize(vN);vec3 V=normalize(uCam-vP);float dist=length(uCam-vP);
  int m=int(vM+.5);vec3 col;vec3 Ls=normalize(uSunDir);
  if(m==2){
    vec2 q=vP.xz;float t=uTime;vec3 n=vec3(0,1,0);
    vec2 dirs[5]=vec2[5](vec2(1,.2),vec2(-.4,1),vec2(.7,-.7),vec2(-1,-.3),vec2(.2,.9));
    float ks[5]=float[5](.35,.55,.9,1.5,2.6);float ws[5]=float[5](1.1,1.4,1.9,2.6,3.3);
    for(int i=0;i<5;i++){vec2 d=normalize(dirs[i]);float ph=dot(d,q)*ks[i]+t*ws[i];float a=uWave*.18/ks[i]*ks[i];
      float dd=a*cos(ph);n.x-=d.x*dd;n.z-=d.y*dd;}
    n=normalize(n);
    vec3 R=reflect(-V,n);R.y=abs(R.y);
    float fr=.03+.97*pow(1.-max(dot(n,V),0.),5.);
    vec3 refl=skyAt(R);
    float sp=pow(max(dot(R,Ls),0.),300.)*14.+pow(max(dot(R,Ls),0.),40.)*.4;
    col=mix(uWaterCol,refl,fr)+uSunCol*sp;
    for(int i=0;i<8;i++){if(i>=uNL)break;vec3 Lv=uLP[i]-vP;float d2=dot(Lv,Lv);
      col+=uLC[i]*pow(max(dot(R,normalize(Lv)),0.),90.)*6./(1.+d2*.01);}
  } else if(m==3){
    col=vC;
  } else {
    float diff=max(dot(N,Ls),0.);float hemi=.5+.5*N.y;
    vec3 amb=mix(uGndAmb,uSkyAmb,hemi);
    col=vC*(amb+uSunCol*diff);
    for(int i=0;i<8;i++){if(i>=uNL)break;vec3 Lv=uLP[i]-vP;float d2=dot(Lv,Lv);
      col+=vC*uLC[i]*max(dot(N,normalize(Lv)),0.)/(1.+d2*.06);}
    float rim=pow(1.-max(dot(N,V),0.),4.);col+=uRimCol*rim*.5;
    if(m==1&&abs(N.y)<.5){
      vec2 uv=vec2(dot(vP.xz,vec2(-N.z,N.x))*.9,vP.y*.75);vec2 cell=floor(uv);vec2 f=fract(uv);
      float win=smoothstep(.2,.28,f.x)*smoothstep(.8,.72,f.x)*smoothstep(.25,.33,f.y)*smoothstep(.85,.77,f.y);
      float hh=h21(cell+floor(vP.xz*.05)*3.1);
      float lit=step(1.-uWinDensity,hh);
      col+=uWinCol*win*lit*(.5+h21(cell*1.7+3.)*1.2);
    }
  }
  float fogF=1.-exp(-uFog*dist);
  vec3 fc=uFogCol+uSunCol*pow(max(dot(-V,Ls),0.),8.)*.25;
  col=mix(col,fc,fogF);
  o=vec4(col,1.);
}`);

const skyP = prog(`#version 300 es
out vec2 vNdc;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vNdc=p*2.-1.;gl_Position=vec4(vNdc,1.,1.);}`,
`#version 300 es
precision highp float;in vec2 vNdc;uniform mat4 uInvVP;uniform vec3 uCam;uniform float uTime;out vec4 o;
${COMMON}
void main(){vec4 p=uInvVP*vec4(vNdc,1.,1.);vec3 d=normalize(p.xyz/p.w-uCam);
  vec3 c=skyAt(d);
  if(uStars>0.&&d.y>0.){vec3 g=floor(d*420.);float h=h31(g);
    float tw=.6+.4*sin(uTime*3.+h*40.);
    c+=vec3(.8,.85,1.)*smoothstep(.9975,1.,h)*uStars*6.*tw*smoothstep(0.,.25,d.y);}
  c=mix(c,uFogCol,clamp(1.-d.y*6.,0.,1.)*.6*step(0.,d.y)*min(uFog*80.,1.));
  o=vec4(c,1.);}`);

const ptsP = prog(`#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in float aS;layout(location=2) in vec3 aC;layout(location=3) in float aK;
uniform mat4 uVP;uniform float uTime,uPx;uniform vec3 uCam;out vec3 vC;out float vF;
void main(){vec3 p=aP;
  if(aK>.5){float s=aP.x*.37+aP.z*.11;p+=vec3(sin(uTime*.4+s),sin(uTime*.27+s*1.3)*.6,cos(uTime*.33+s))*aK;}
  vec4 cp=uVP*vec4(p,1.);gl_Position=cp;gl_PointSize=max(aS*uPx/cp.w,1.5);
  float d=length(uCam-p);vF=exp(-d*.004);vC=aC;}`,
`#version 300 es
precision highp float;in vec3 vC;in float vF;out vec4 o;
void main(){vec2 q=gl_PointCoord*2.-1.;float r=dot(q,q);if(r>1.)discard;float a=exp(-r*4.);o=vec4(vC*a*vF,1.);}`);

const postP = prog(`#version 300 es
out vec2 vUv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`,
`#version 300 es
precision highp float;in vec2 vUv;uniform sampler2D uTex;uniform float uTime,uFlash,uZoom,uExposure,uGrain,uVig,uBloom,uAb;
uniform vec3 uTint,uLift;uniform vec2 uRes;out vec4 o;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 samp(vec2 uv){vec2 d=(uv-.5)*uAb;return vec3(texture(uTex,uv+d).r,texture(uTex,uv).g,texture(uTex,uv-d).b);}
void main(){vec2 uv=vUv;vec3 c;
  if(uZoom>.001){vec2 dir=uv-.5;c=vec3(0);for(int i=0;i<12;i++){c+=samp(.5+dir*(1.-uZoom*float(i)/12.*.35));}c/=12.;}
  else c=samp(uv);
  vec3 b=vec3(0);
  b+=max(textureLod(uTex,uv,2.).rgb-1.,0.)*.3;b+=max(textureLod(uTex,uv,3.).rgb-.9,0.)*.4;
  b+=max(textureLod(uTex,uv,4.).rgb-.8,0.)*.5;b+=max(textureLod(uTex,uv,5.).rgb-.6,0.)*.6;b+=max(textureLod(uTex,uv,6.).rgb-.4,0.)*.6;
  c+=b*uBloom;

/* sahne örneklerini hazırla */
const R = rng(D.seed || 1);
const built = {};
for (const sc of D.scenes) {
  if (!built[sc.kind]) {
    const def = SCENES[sc.kind]; if (!def) throw new Error('Bilinmeyen sahne: '+sc.kind);
    const b = def.build(R);
    built[sc.kind] = {def, mesh:uploadMesh(b.g), pts:uploadPts(b.pts), lights:b.lights, extra:b};
  }
}

/* ---------------- 3D çizim ---------------- */
function draw3D(sc, t, lt, u, zoom, flash) {
  const B = built[sc.kind], E = B.def.env;
  const camF = B.def.cams[sc.cam] || Object.values(B.def.cams)[0];
  const cam = camF(u, B.extra);
  const DY = B.def.dyn ? B.def.dyn(u, lt, sc.dur, B.extra, sc) : null;
  let fov = cam.fov * Math.PI / 180; if (!PORTRAIT) fov *= .62;
  const P = M.persp(fov, GW/GH, .3, 4000), V = M.lookAt(cam.eye, cam.target, [0,1,0]);
  const VP = M.mul(P, V), inv = M.inv(VP);
  const sunCol = scl(E.sunCol, E.sunInt), sunDir = norm(E.sunDir);

  gl.bindFramebuffer(gl.FRAMEBUFFER, msFB); gl.viewport(0,0,GW,GH);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const env = (pp) => { const u_=pp.u;
    gl.uniform3fv(u_.uSunDir,sunDir);gl.uniform3fv(u_.uSunCol,sunCol);gl.uniform3fv(u_.uZenith,C(E.zenith));gl.uniform3fv(u_.uHorizon,C(E.horizon));
    gl.uniform3fv(u_.uGround,C(E.ground));gl.uniform3fv(u_.uFogCol,C(E.fog));gl.uniform1f(u_.uSunSize,E.sunSize);gl.uniform1f(u_.uStars,E.stars);gl.uniform1f(u_.uFog,E.fogD);};
  // gökyüzü
  gl.disable(gl.DEPTH_TEST); gl.useProgram(skyP.p); env(skyP);
  gl.uniformMatrix4fv(skyP.u.uInvVP,false,inv); gl.uniform3fv(skyP.u.uCam,cam.eye); gl.uniform1f(skyP.u.uTime,t);
  gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  // modeller
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.CULL_FACE);
  const mp=meshP; gl.useProgram(mp.p); env(mp);
  gl.uniformMatrix4fv(mp.u.uVP,false,VP); gl.uniform3fv(mp.u.uCam,cam.eye); gl.uniform1f(mp.u.uTime,t);
  gl.uniform3fv(mp.u.uSkyAmb,E.skyAmb); gl.uniform3fv(mp.u.uGndAmb,E.gndAmb); gl.uniform3fv(mp.u.uRimCol,E.rim);
  gl.uniform3fv(mp.u.uWinCol,scl(E.win,E.winI)); gl.uniform1f(mp.u.uWinDensity,E.winD); gl.uniform3fv(mp.u.uWaterCol,C(E.water)); gl.uniform1f(mp.u.uWave,E.wave);
  const L=((DY&&DY.lights)||B.lights).slice(0,8); const lp=new Float32Array(24), lc=new Float32Array(24);
  L.forEach((l,i)=>{lp.set(l.p,i*3);lc.set(l.c,i*3)});
  gl.uniform3fv(mp.u.uLP,lp); gl.uniform3fv(mp.u.uLC,lc); gl.uniform1i(mp.u.uNL,L.length);
  gl.bindVertexArray(B.mesh.vao); gl.drawArrays(gl.TRIANGLES,0,B.mesh.n);
  const free=o=>{gl.deleteVertexArray(o.vao);gl.deleteBuffer(o.b)};
  if(DY&&DY.g&&DY.g.v.length){const dm=uploadMesh(DY.g);gl.bindVertexArray(dm.vao);gl.drawArrays(gl.TRIANGLES,0,dm.n);free(dm);}
  // parçacıklar
  gl.useProgram(ptsP.p); gl.uniformMatrix4fv(ptsP.u.uVP,false,VP); gl.uniform1f(ptsP.u.uTime,t);
  gl.uniform1f(ptsP.u.uPx,GH*.9); gl.uniform3fv(ptsP.u.uCam,cam.eye);
  gl.depthMask(false); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.bindVertexArray(B.pts.vao); gl.drawArrays(gl.POINTS,0,B.pts.n);
  if(DY&&DY.pts&&DY.pts.length){const dp=uploadPts(DY.pts);gl.bindVertexArray(dp.vao);gl.drawArrays(gl.POINTS,0,dp.n);free(dp);}
  gl.disable(gl.BLEND); gl.depthMask(true);
  // MSAA çöz + mipmap (bloom)
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFB); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,rFB);
  gl.blitFramebuffer(0,0,GW,GH,0,0,GW,GH,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.bindTexture(gl.TEXTURE_2D,rTex); gl.generateMipmap(gl.TEXTURE_2D);
  // son işlem
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,GW,GH); gl.disable(gl.DEPTH_TEST);
  const pp=postP; gl.useProgram(pp.p); gl.uniform1i(pp.u.uTex,0);
  const G=D.grade||{};
  gl.uniform1f(pp.u.uTime,t); gl.uniform1f(pp.u.uFlash,flash); gl.uniform1f(pp.u.uZoom,zoom);
  gl.uniform1f(pp.u.uExposure,E.exposure*(G.exposure||1)); gl.uniform1f(pp.u.uGrain,G.grain??.035); gl.uniform1f(pp.u.uVig,G.vignette??.55);
  gl.uniform1f(pp.u.uBloom,G.bloom??1.0); gl.uniform1f(pp.u.uAb,.0025+zoom*.01);
  gl.uniform3fv(pp.u.uTint,hex(G.tint||'#ffffff')); gl.uniform3fv(pp.u.uLift,hex(G.lift||'#050a10').map(v=>v*.6)); gl.uniform2f(pp.u.uRes,GW,GH);
  gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES,0,3);
}

const ACC = D.accent || '#FFD24D';
const FONT = D.font || 'Montserrat';
const up = s => s.toLocaleUpperCase('tr-TR');

  const words=ch.words.map(w=>up(w.w));const space=ctx.measureText(' ').width;let total=words.reduce((s,w)=>s+ctx.measureText(w).width,0)+space*(words.length-1);

/* ---------------- kare çizimi ---------------- */
function sceneAt(t){let i=D.scenes.findIndex(s=>t>=s.start&&t<s.start+s.dur);if(i<0)i=D.scenes.length-1;return i}

  const t = opt.t ?? fi / FPS; const i = sceneAt(t), sc = D.scenes[i];
